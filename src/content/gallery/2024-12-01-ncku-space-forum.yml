title: "2024 NCKU SPACE FORUM 太空科學論壇"
titleEn: "2024 NCKU Space Forum"
date: "2024-12-01"
description: "2024年12月1日至3日，國立成功大學夏漢民太空科技中心舉辦太空科學論壇，邀集國內外太空領域專家學者共聚一堂，深度交流太空科學與技術最新發展。"
descriptionEn: "From December 1–3, 2024, the HMSSTC at NCKU hosted the NCKU Space Forum, bringing together domestic and international experts in space science and technology for in-depth discussions on the latest developments in the field."
