title: "第七屆國際導航衛星掩星觀測研討會(ICGPSRO)"
titleEn: "7th International Conference on GPS Radio Occultation"
date: "2026-05-08"
description: "2025年10月28日至30日於國立成功大學舉辦的第七屆國際導航衛星掩星觀測研討會精彩紀實，大會主軸為推動氣象、氣候與太空科學應用的全球衛星導航系統（GNSS）遙測技術發展。"
descriptionEn: "Highlights from the 7th International Conference on GPS Radio Occultation (ICGPSRO) held from October 28-30, 2025, at National Cheng Kung University. Advancing GNSS-based remote sensing for meteorology, climate, and space science applications."
