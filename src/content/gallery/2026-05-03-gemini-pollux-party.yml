title: "立方衛星 Gemini-Pollux 發射 party"
titleEn: "Gemini-Pollux CubeSat Launch Party"
date: "2026-05-09"
description: "2026年5月3日下午舉辦的立方衛星發射直播觀禮。由成大師生一手打造的「雙子星─波魯克斯」（Gemini─Pollux）立方衛星，搭載美國 SpaceX Falcon 9 火箭自范登堡太空軍基地發射升空，帶著眾人的期盼順利進入距地約 590 公里的低地球軌道，展現台灣太空人才培育與本土產業合作成果。"
descriptionEn: "Live stream viewing party on May 3, 2026, for the launch of the Gemini-Pollux CubeSat. Designed and built by NCKU students and faculty, the satellite was successfully launched into a 590 km low Earth orbit aboard a SpaceX Falcon 9 rocket from Vandenberg Space Force Base, showcasing Taiwan's achievements in space talent cultivation and local industry collaboration."
