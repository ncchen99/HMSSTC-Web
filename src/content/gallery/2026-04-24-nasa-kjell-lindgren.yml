title: "NASA太空人Dr. Kjell Lindgren林琪兒博士參訪"
titleEn: "Visit by NASA Astronaut Dr. Kjell Lindgren"
date: "2026-04-24"
description: "2026年4月24日，NASA太空人Dr. Kjell Lindgren林琪兒博士蒞臨國立成功大學夏漢民太空科技中心參訪，與師生進行交流，分享太空探索經驗與人類太空飛行的未來展望。"
descriptionEn: "On April 24, 2026, NASA astronaut Dr. Kjell Lindgren visited the HMSSTC at NCKU, engaging with faculty and students to share his experiences in space exploration and his vision for the future of human spaceflight."
